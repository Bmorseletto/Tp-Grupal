      - MOM_HOST=rabbitmq
      - FILTER_PREFIX=DateFilter
      - OUTPUTS_PREFIX=AvgCalc,Q4Graph
      - OUTPUTS_AMOUNTS=3,3   
      - UPSTREAM_AMOUNT=3
      - ROUTING_HASH_TARGET=payment_format,to_bank+to_account+from_bank+from_account
      - INITIAL_DATE=2022/09/01
      - END_DATE=2022/09/05
      - PYTHONUNBUFFERED=1
      - NODE_NAME=date_filter_1
      - MANAGER_HOSTS=manager_0,manager_1,manager_2
