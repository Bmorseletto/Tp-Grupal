services:
  client_0:
    build:
      context: ./src/
      dockerfile: client/Dockerfile
    container_name: client_0
    depends_on:
    - currency_filter_0
    - currency_filter_1
    - currency_filter_2
    - query_5_date_filter_0
    - query_5_date_filter_1
    - query_5_date_filter_2
    environment:
    - TRANSACTIONS_INPUT_FILE=/datasets/input_0.csv
    - ACCOUNTS_INPUT_FILE=/datasets/accounts_0.csv
    - OUTPUT_FILE=/output/output_0.csv
    - PYTHONUNBUFFERED=1
    - SERVER_HOST=gateway
    - SERVER_PORT=5678
    volumes:
    - ./datasets:/datasets
    - ./output:/output
  client_1:
    build:
      context: ./src/
      dockerfile: client/Dockerfile
    container_name: client_1
    depends_on:
    - currency_filter_0
    - currency_filter_1
    - currency_filter_2
    - query_5_date_filter_0
    - query_5_date_filter_1
    - query_5_date_filter_2
    environment:
    - TRANSACTIONS_INPUT_FILE=/datasets/input_1.csv
    - ACCOUNTS_INPUT_FILE=/datasets/accounts_1.csv
    - OUTPUT_FILE=/output/output_1.csv
    - PYTHONUNBUFFERED=1
    - SERVER_HOST=gateway
    - SERVER_PORT=5678
    volumes:
    - ./datasets:/datasets
    - ./output:/output
  client_2:
    build:
      context: ./src/
      dockerfile: client/Dockerfile
    container_name: client_2
    depends_on:
    - currency_filter_0
    - currency_filter_1
    - currency_filter_2
    - query_5_date_filter_0
    - query_5_date_filter_1
    - query_5_date_filter_2
    environment:
    - TRANSACTIONS_INPUT_FILE=/datasets/input_2.csv
    - ACCOUNTS_INPUT_FILE=/datasets/accounts_2.csv
    - OUTPUT_FILE=/output/output_2.csv
    - PYTHONUNBUFFERED=1
    - SERVER_HOST=gateway
    - SERVER_PORT=5678
    volumes:
    - ./datasets:/datasets
    - ./output:/output
  gateway:
    build:
      context: ./src/
      dockerfile: gateway/Dockerfile
    container_name: gateway
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - OUTPUT_QUEUE=Query2_Aggregator_accounts
      - MOM_HOST=rabbitmq
      - PYTHONUNBUFFERED=1
      - SERVER_HOST=gateway
      - SERVER_PORT=5678
      - AMOUNT_CURRENCY=3
      - CURRENCY_PREFIX=CurrencyFilter
      - Q5_PREFIX=DateFilterQ5
      - AMOUNT_Q5=3
      - QUERY_AMOUNT=5
      - RESULT_QUEUES=Gateway_Q1_Results,Gateway_Q2_Results,Gateway_Q3_Results,Gateway_Q4_Results,Gateway_Q5_Results
  currency_filter_0:
    build:
      context: ./src/
      dockerfile: usd_filter/Dockerfile
    container_name: currency_filter_0
    depends_on:
      - dollar_amount_filter_0
      - dollar_amount_filter_1
      - dollar_amount_filter_2
      - max_transaction_filter_0
      - max_transaction_filter_1
      - max_transaction_filter_2
      - query_3_date_filter_0
      - query_3_date_filter_1
      - query_3_date_filter_2
      - date_filter_0
      - date_filter_1
      - date_filter_2
    environment:
      - ID=0
      - MOM_HOST=rabbitmq
      - AMOUNT_CURRENCY=3
      - FILTER_AMOUNT=3
      - FILTER_PREFIX=CurrencyFilter
      - FILTER_Q1_AMOUNT=3
      - FILTER_Q1_PREFIX=DollarAmtFilter
      - FILTER_Q2_AMOUNT=3
      - FILTER_Q2_PREFIX=MaxTransactionFilter
      - FILTER_DATE_AMOUNT=3
      - FILTER_DATE_PREFIX=DateFilter
      - FILTER_Q3_PREFIX=DateFilterQ3
      - FILTER_Q3_AMOUNT=3
      - PYTHONUNBUFFERED=1
      - NODE_NAME=currency_filter_0
      - MANAGER_HOSTS=manager_0,manager_1,manager_2
      - MANAGER_PORT=5679
  currency_filter_1:
    build:
      context: ./src/
      dockerfile: usd_filter/Dockerfile
    container_name: currency_filter_1
    depends_on:
      - dollar_amount_filter_0
      - dollar_amount_filter_1
      - dollar_amount_filter_2
      - max_transaction_filter_0
      - max_transaction_filter_1
      - max_transaction_filter_2
      - query_3_date_filter_0
      - query_3_date_filter_1
      - query_3_date_filter_2
      - date_filter_0
      - date_filter_1
      - date_filter_2
    environment:
      - ID=1
      - MOM_HOST=rabbitmq
      - AMOUNT_CURRENCY=3
      - FILTER_AMOUNT=3
      - FILTER_PREFIX=CurrencyFilter
      - FILTER_Q1_AMOUNT=3
      - FILTER_Q1_PREFIX=DollarAmtFilter
      - FILTER_Q2_AMOUNT=3
      - FILTER_Q2_PREFIX=MaxTransactionFilter
      - FILTER_DATE_AMOUNT=3
      - FILTER_DATE_PREFIX=DateFilter
      - FILTER_Q3_PREFIX=DateFilterQ3
      - FILTER_Q3_AMOUNT=3
      - PYTHONUNBUFFERED=1
      - NODE_NAME=currency_filter_1
      - MANAGER_HOSTS=manager_0,manager_1,manager_2
      - MANAGER_PORT=5679
  currency_filter_2:
    build:
      context: ./src/
      dockerfile: usd_filter/Dockerfile
    container_name: currency_filter_2
    depends_on:
      - dollar_amount_filter_0
      - dollar_amount_filter_1
      - dollar_amount_filter_2
      - max_transaction_filter_0
      - max_transaction_filter_1
      - max_transaction_filter_2
      - query_3_date_filter_0
      - query_3_date_filter_1
      - query_3_date_filter_2
      - date_filter_0
      - date_filter_1
      - date_filter_2
    environment:
      - ID=2
      - MOM_HOST=rabbitmq
      - AMOUNT_CURRENCY=3
      - FILTER_AMOUNT=3
      - FILTER_PREFIX=CurrencyFilter
      - FILTER_Q1_AMOUNT=3
      - FILTER_Q1_PREFIX=DollarAmtFilter
      - FILTER_Q2_AMOUNT=3
      - FILTER_Q2_PREFIX=MaxTransactionFilter
      - FILTER_DATE_AMOUNT=3
      - FILTER_DATE_PREFIX=DateFilter
      - FILTER_Q3_PREFIX=DateFilterQ3
      - FILTER_Q3_AMOUNT=3
      - PYTHONUNBUFFERED=1
      - NODE_NAME=currency_filter_2
      - MANAGER_HOSTS=manager_0,manager_1,manager_2
      - MANAGER_PORT=5679
  dollar_amount_filter_0:
    build:
      context: ./src/
      dockerfile: filter_q1/Dockerfile
    container_name: dollar_amount_filter_0
    depends_on:
      - query_1_aggregator
    environment:
      - ID=0
      - MOM_HOST=rabbitmq
      - OUTPUT_QUEUE=Query1_Aggregator
      - FILTER_AMOUNT=3
      - FILTER_PREFIX=DollarAmtFilter
      - UPSTREAM_AMOUNT=3
      - PYTHONUNBUFFERED=1
      - NODE_NAME=dollar_amount_filter_0
      - MANAGER_HOSTS=manager_0,manager_1,manager_2
      - MANAGER_PORT=5679
  dollar_amount_filter_1:
    build:
      context: ./src/
      dockerfile: filter_q1/Dockerfile
    container_name: dollar_amount_filter_1
    depends_on:
      - query_1_aggregator
    environment:
      - ID=1
      - MOM_HOST=rabbitmq
      - OUTPUT_QUEUE=Query1_Aggregator
      - FILTER_AMOUNT=3
      - FILTER_PREFIX=DollarAmtFilter
      - UPSTREAM_AMOUNT=3
      - PYTHONUNBUFFERED=1
      - NODE_NAME=dollar_amount_filter_1
      - MANAGER_HOSTS=manager_0,manager_1,manager_2
      - MANAGER_PORT=5679
  dollar_amount_filter_2:
    build:
      context: ./src/
      dockerfile: filter_q1/Dockerfile
    container_name: dollar_amount_filter_2
    depends_on:
      - query_1_aggregator
    environment:
      - ID=2
      - MOM_HOST=rabbitmq
      - OUTPUT_QUEUE=Query1_Aggregator
      - FILTER_AMOUNT=3
      - FILTER_PREFIX=DollarAmtFilter
      - UPSTREAM_AMOUNT=3
      - PYTHONUNBUFFERED=1
      - NODE_NAME=dollar_amount_filter_2
      - MANAGER_HOSTS=manager_0,manager_1,manager_2
      - MANAGER_PORT=5679
  query_1_aggregator:
    build:
      context: ./src/
      dockerfile: agg_q1/Dockerfile
    container_name: query_1_aggregator
    depends_on:
      - gateway
    environment:
      - ID=0
      - MOM_HOST=rabbitmq
      - INPUT_QUEUE=Query1_Aggregator
      - OUTPUT_QUEUE=Gateway_Q1_Results
      - Q1_FILTER_AMOUNT=3
      - Q1_FILTER_PREFIX=DollarAmtFilter
      - PYTHONUNBUFFERED=1
      - NODE_NAME=query_1_aggregator
      - MANAGER_HOSTS=manager_0,manager_1,manager_2
      - MANAGER_PORT=5679
    volumes:
      - ./output:/output
  query_2_aggregator:
    build:
      context: ./src/
      dockerfile: agg_q2/Dockerfile
    container_name: query_2_aggregator
    depends_on:
