      - MOM_HOST=rabbitmq
      - FILTER_PREFIX=DateFilterQ3
      - OUTPUTS_PREFIX=AvgFilter
      - OUTPUTS_AMOUNTS=3
      - UPSTREAM_AMOUNT=3
      - ROUTING_HASH_TARGET=account
      - INITIAL_DATE=2022/09/06
      - END_DATE=2022/09/15
      - PYTHONUNBUFFERED=1
      - NODE_NAME=query_3_date_filter_2
      - MANAGER_HOSTS=manager_0,manager_1,manager_2
      - MANAGER_PORT=5679


