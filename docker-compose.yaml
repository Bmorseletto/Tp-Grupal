      - MOM_HOST=rabbitmq
      - FILTER_PREFIX=DateFilter
      - OUTPUTS_PREFIX=AvgCalc,Q4Graph
      - OUTPUTS_AMOUNTS=3,3   
      - UPSTREAM_AMOUNT=3
      - ROUTING_HASH_TARGET=payment_format,to_bank+to_account+from_bank+from_account
      - INITIAL_DATE=2022/09/01
      - END_DATE=2022/09/05
      - PYTHONUNBUFFERED=1
      - NODE_NAME=date_filter_0
      - MANAGER_HOSTS=manager_0,manager_1,manager_2
      - MANAGER_PORT=5679

  date_filter_1:
    build:
      context: ./src/
      dockerfile: filter_date/Dockerfile
    container_name: date_filter_1
    depends_on:
      - query_3_avg_calc_0
      - query_3_avg_calc_1
      - query_3_avg_calc_2
      - query_4_graph_0
      - query_4_graph_1
      - query_4_graph_2
    environment:
