      dockerfile: filter_q2/Dockerfile
    container_name: max_transaction_filter_1
    depends_on:
      - query_2_aggregator
    environment:
      - ID=1
      - MOM_HOST=rabbitmq
      - OUTPUT_QUEUE=Query2_Aggregator
      - FILTER_AMOUNT=3
      - FILTER_PREFIX=MaxTransactionFilter
      - UPSTREAM_AMOUNT=3
      - PYTHONUNBUFFERED=1
      - NODE_NAME=max_transaction_filter_1
      - MANAGER_HOSTS=manager_0,manager_1,manager_2
      - MANAGER_PORT=5679
  max_transaction_filter_2:
    build:
      context: ./src/
      dockerfile: filter_q2/Dockerfile
    container_name: max_transaction_filter_2
    depends_on:
      - query_2_aggregator
    environment:
      - ID=2
      - MOM_HOST=rabbitmq
      - OUTPUT_QUEUE=Query2_Aggregator
      - FILTER_AMOUNT=3
      - FILTER_PREFIX=MaxTransactionFilter
      - UPSTREAM_AMOUNT=3
      - PYTHONUNBUFFERED=1
      - NODE_NAME=max_transaction_filter_2
      - MANAGER_HOSTS=manager_0,manager_1,manager_2
      - MANAGER_PORT=5679
    ###############################
  #           QUERY 3           #
  ###############################
  query_3_aggregator:
    build:
      context: ./src/
      dockerfile: agg_q3/Dockerfile
    container_name: query_3_aggregator
    depends_on:
      - gateway
    environment:
      - ID=0
      - MOM_HOST=rabbitmq
      - INPUT_QUEUE=Query3_Aggregator
      - OUTPUT_QUEUE=Gateway_Q3_Results
      - Q3_FILTER_AMOUNT=3
      - Q3_FILTER_PREFIX=AvgFilter
      - PYTHONUNBUFFERED=1
      - NODE_NAME=query_3_aggregator
      - MANAGER_HOSTS=manager_0,manager_1,manager_2
      - MANAGER_PORT=5679
    volumes:
      - ./output:/output
  query_3_avg_filter_0:
    build:
      context: ./src/
      dockerfile: filter_q3_comparison/Dockerfile
    container_name: query_3_avg_filter_0
    depends_on:
      - query_3_aggregator
    environment:
      - ID=0
      - MOM_HOST=rabbitmq
      - FILTER_AMOUNT=3      
      - FILTER_PREFIX=AvgFilter
      - OUTPUT_QUEUE=Query3_Aggregator
      - AVG_CALC_AMOUNT=3     
      - DATE_FILTER_AMOUNT=3  
      - PYTHONUNBUFFERED=1
      - NODE_NAME=query_3_avg_filter_0
      - MANAGER_HOSTS=manager_0,manager_1,manager_2
      - MANAGER_PORT=5679
    volumes:
      - ./output:/output

  query_3_avg_filter_1:
    build:
      context: ./src/
      dockerfile: filter_q3_comparison/Dockerfile
    container_name: query_3_avg_filter_1
    depends_on:
      - query_3_aggregator
    environment:
      - ID=1                    
      - MOM_HOST=rabbitmq
      - FILTER_AMOUNT=3
      - FILTER_PREFIX=AvgFilter
      - OUTPUT_QUEUE=Query3_Aggregator
      - AVG_CALC_AMOUNT=3
      - DATE_FILTER_AMOUNT=3
      - PYTHONUNBUFFERED=1
      - NODE_NAME=query_3_avg_filter_1
      - MANAGER_HOSTS=manager_0,manager_1,manager_2
      - MANAGER_PORT=5679
    volumes:
      - ./output:/output
  query_3_avg_filter_2:
    build:
      context: ./src/
      dockerfile: filter_q3_comparison/Dockerfile
    container_name: query_3_avg_filter_2
    depends_on:
      - query_3_aggregator
    environment:
      - ID=2                 
      - MOM_HOST=rabbitmq
      - FILTER_AMOUNT=3
      - FILTER_PREFIX=AvgFilter
      - OUTPUT_QUEUE=Query3_Aggregator
      - AVG_CALC_AMOUNT=3
      - DATE_FILTER_AMOUNT=3
      - PYTHONUNBUFFERED=1
      - NODE_NAME=query_3_avg_filter_2
      - MANAGER_HOSTS=manager_0,manager_1,manager_2
      - MANAGER_PORT=5679
    volumes:
      - ./output:/output

  # ==========================================
  # QUERY 3 AVG CALC
  # ==========================================
  query_3_avg_calc_0:
    build:
      context: ./src/
      dockerfile: filter_q3_avg/Dockerfile
    container_name: query_3_avg_calc_0
    depends_on:
      - query_3_avg_filter_0
      - query_3_avg_filter_1
      - query_3_avg_filter_2  # Depende de ambos filtros aguas abajo
    environment:
      - ID=0
      - MOM_HOST=rabbitmq
      - FILTER_AMOUNT=3        # Cooperando con ID 1
      - FILTER_PREFIX=AvgCalc
      - OUTPUT_PREFIX=AvgFilter
      - OUTPUT_AMOUNT=3        # Envía a 2 AvgFilters
      - UPSTREAM_AMOUNT=3
      - PYTHONUNBUFFERED=1
      - NODE_NAME=query_3_avg_calc_0
      - MANAGER_HOSTS=manager_0,manager_1,manager_2
      - MANAGER_PORT=5679
    volumes:
      - ./output:/output

  query_3_avg_calc_1:
    build:
      context: ./src/
      dockerfile: filter_q3_avg/Dockerfile
    container_name: query_3_avg_calc_1
    depends_on:
      - query_3_avg_filter_0
      - query_3_avg_filter_1
      - query_3_avg_filter_2
    environment:
      - ID=1                    # Nuevo ID
      - MOM_HOST=rabbitmq
      - FILTER_AMOUNT=3
      - FILTER_PREFIX=AvgCalc
      - OUTPUT_PREFIX=AvgFilter
      - OUTPUT_AMOUNT=3
      - UPSTREAM_AMOUNT=3
      - PYTHONUNBUFFERED=1
      - NODE_NAME=query_3_avg_calc_1
      - MANAGER_HOSTS=manager_0,manager_1,manager_2
      - MANAGER_PORT=5679
    volumes:
      - ./output:/output
  
  query_3_avg_calc_2:
    build:
      context: ./src/
      dockerfile: filter_q3_avg/Dockerfile
    container_name: query_3_avg_calc_2
    depends_on:
      - query_3_avg_filter_0
      - query_3_avg_filter_1
      - query_3_avg_filter_2
    environment:
      - ID=2                    # Nuevo ID
      - MOM_HOST=rabbitmq
      - FILTER_AMOUNT=3
      - FILTER_PREFIX=AvgCalc
      - OUTPUT_PREFIX=AvgFilter
      - OUTPUT_AMOUNT=3
      - UPSTREAM_AMOUNT=3
      - PYTHONUNBUFFERED=1
      - NODE_NAME=query_3_avg_calc_2
      - MANAGER_HOSTS=manager_0,manager_1,manager_2
      - MANAGER_PORT=5679
    volumes:
      - ./output:/output

  # ==========================================
  # QUERY 3 DATE FILTER
  # ==========================================
  query_3_date_filter_0:
    build:
      context: ./src/
      dockerfile: filter_date/Dockerfile
    container_name: query_3_date_filter_0
    depends_on:
      - query_3_avg_filter_0
      - query_3_avg_filter_1
      - query_3_avg_filter_2
    environment:
      - ID=0
      - MOM_HOST=rabbitmq
      - FILTER_PREFIX=DateFilterQ3
      - OUTPUTS_PREFIX=AvgFilter
      - OUTPUTS_AMOUNTS=3 
      - UPSTREAM_AMOUNT=3
      - ROUTING_HASH_TARGET=account
      - INITIAL_DATE=2022/09/06
      - END_DATE=2022/09/15
      - PYTHONUNBUFFERED=1
      - NODE_NAME=query_3_date_filter_0
      - MANAGER_HOSTS=manager_0,manager_1,manager_2
      - MANAGER_PORT=5679

  query_3_date_filter_1:
    build:
      context: ./src/
      dockerfile: filter_date/Dockerfile
    container_name: query_3_date_filter_1
    depends_on:
      - query_3_avg_filter_0
      - query_3_avg_filter_1
      - query_3_avg_filter_2
    environment:
      - ID=1                    
      - MOM_HOST=rabbitmq
      - FILTER_PREFIX=DateFilterQ3
      - OUTPUTS_PREFIX=AvgFilter
      - OUTPUTS_AMOUNTS=3
      - UPSTREAM_AMOUNT=3
      - ROUTING_HASH_TARGET=account
      - INITIAL_DATE=2022/09/06
      - END_DATE=2022/09/15
      - PYTHONUNBUFFERED=1
      - NODE_NAME=query_3_date_filter_1
      - MANAGER_HOSTS=manager_0,manager_1,manager_2
      - MANAGER_PORT=5679
  query_3_date_filter_2:
    build:
      context: ./src/
      dockerfile: filter_date/Dockerfile
    container_name: query_3_date_filter_2
    depends_on:
      - query_3_avg_filter_0
      - query_3_avg_filter_1
      - query_3_avg_filter_2
    environment:
