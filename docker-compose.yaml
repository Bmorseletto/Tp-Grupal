      - ROUTING_HASH_TARGET=payment_format,to_bank+to_account+from_bank+from_account
      - INITIAL_DATE=2022/09/01
      - END_DATE=2022/09/05
      - PYTHONUNBUFFERED=1
      - NODE_NAME=date_filter_2
      - MANAGER_HOSTS=manager_0,manager_1,manager_2
      - MANAGER_PORT=5679
  ##############################################
  ############## Query 4 #######################
  query_4_graph_0:
    build:
      context: ./src/
      dockerfile: filter_q4_graph/Dockerfile
    container_name: query_4_graph_0
    depends_on:
      - query_4_scatter_detector_0
      - query_4_scatter_detector_1
      - query_4_scatter_detector_2
    environment:
      - ID=0
      - MOM_HOST=rabbitmq
      - FILTER_AMOUNT=3
      - FILTER_PREFIX=Q4Graph
      - OUTPUT_PREFIX=Q4GScatterDetector
      - OUTPUT_AMOUNT=3
      - FILTER_DATE_AMOUNT=3
      - SCATTER_VALUE=5
      - PYTHONUNBUFFERED=1
      - NODE_NAME=query_4_graph_0
      - MANAGER_HOSTS=manager_0,manager_1,manager_2
      - MANAGER_PORT=5679
    volumes:
      - ./output:/output

  query_4_graph_1:
    build:
      context: ./src/
      dockerfile: filter_q4_graph/Dockerfile
    container_name: query_4_graph_1
    depends_on:
      - query_4_scatter_detector_0
      - query_4_scatter_detector_1
      - query_4_scatter_detector_2
    environment:
      - ID=1
      - MOM_HOST=rabbitmq
      - FILTER_AMOUNT=3
      - FILTER_PREFIX=Q4Graph
      - OUTPUT_PREFIX=Q4GScatterDetector
      - OUTPUT_AMOUNT=3
