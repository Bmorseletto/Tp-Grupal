  # DATE FILTER (GENERAL)
  # ==========================================
  date_filter_0:
    build:
      context: ./src/
      dockerfile: filter_date/Dockerfile
    container_name: date_filter_0
    depends_on:
      - query_3_avg_calc_0
      - query_3_avg_calc_1
      - query_3_avg_calc_2
      - query_4_graph_0
      - query_4_graph_1
      - query_4_graph_2
